# Book table for the deterministic locus parser.
#
# key        internal id, used in node ids (pt:mark.6.37)
# sbl        display abbreviation used in canonical names (SBL Handbook, 2nd ed.)
# chapters   number of chapters (single-chapter books take "Phlm 9" as verse 9)
# en/de/fr/it  names and abbreviations in each language. Short abbreviations that
#            mean different books in different languages (e.g. "Gn", "Ab") are
#            resolved using the document's detected language.
# numbered   for 1-3 John, 1-2 Cor, etc. the aliases are stems; numeral prefixes
#            ("1 Kor", "1Kor", "1. Kor", "I Cor", "First Corinthians") are generated.

